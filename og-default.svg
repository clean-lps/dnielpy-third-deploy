<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    OG image placeholder. 1200x630 spec.
    Solid navy + orange + brand lockup. Real photo / branded version should
    replace this file in /public/og-default.jpg (raster) for max compatibility.
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1C3F" />
      <stop offset="100%" stop-color="#001535" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <!-- Grid pattern -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 0H1200M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200" />
    <path d="M0 0V630M80 0V630M160 0V630M240 0V630M320 0V630M400 0V630M480 0V630M560 0V630M640 0V630M720 0V630M800 0V630M880 0V630M960 0V630M1040 0V630M1120 0V630" />
  </g>
  <!-- Brand mark: simplified gorila head silhouette + wrench -->
  <g transform="translate(96 80)">
    <!-- Head circle -->
    <circle cx="60" cy="60" r="58" fill="#00C2FF" />
    <!-- Snout -->
    <ellipse cx="60" cy="78" rx="34" ry="24" fill="#0B1C3F" />
    <!-- Eyes -->
    <circle cx="44" cy="50" r="6" fill="#0B1C3F" />
    <circle cx="76" cy="50" r="6" fill="#0B1C3F" />
    <!-- Wrench overlay -->
    <rect x="-10" y="100" width="140" height="10" rx="3" fill="#FF6B00" transform="rotate(35 60 105)" />
  </g>
  <!-- Text block -->
  <g font-family="Oswald, Impact, sans-serif" fill="#FFFFFF">
    <text x="96" y="280" font-size="36" font-weight="700" letter-spacing="6" fill="#FFCC00">24/7 EMERGENCY</text>
    <text x="96" y="370" font-size="78" font-weight="700" letter-spacing="-1" fill="#FFFFFF">ADVANCED</text>
    <text x="96" y="450" font-size="78" font-weight="700" letter-spacing="-1" fill="#FF6B00">PLUMBING SERVICES</text>
    <text x="96" y="520" font-size="32" font-weight="500" letter-spacing="2" fill="#FFFFFF" opacity="0.85">Miami-Dade · S.W. Florida</text>
  </g>
  <!-- Phone badge -->
  <g transform="translate(820 470)">
    <rect x="0" y="0" width="280" height="80" rx="40" fill="#FF6B00" />
    <text x="140" y="52" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="32" font-weight="700" fill="#FFFFFF">(305) 755-2124</text>
  </g>
</svg>
