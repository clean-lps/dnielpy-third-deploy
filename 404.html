<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Advanced Plumbing Emergency Services</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1C3F" />
    <script>
      // GitHub Pages SPA redirect — rafgraph technique, adapted for /dnielpy-third-deploy/ basename.
      // When GitHub Pages can't find a file, it serves this 404.html. We grab the original path,
      // encode it into ?p=..., and redirect to index.html so React Router can take over.
      (function () {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        var newPath =
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            newPath,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
